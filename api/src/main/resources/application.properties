spring.application.name=habituate-api
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/habituate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Kafka — every check-in write also publishes to checkin-events, in the same
# request (see events.CheckInEventPublisher). No consumer builds real insights
# from this yet; events.CheckInEventLogger just logs, to prove the pipe works.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=habituate-api-log-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.habituate.api.events
spring.kafka.consumer.properties.spring.json.value.default.type=com.habituate.api.events.CheckInEvent

