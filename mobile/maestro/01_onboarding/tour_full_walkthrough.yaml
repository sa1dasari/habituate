appId: com.habituate.mobile
# Taps through all 5 steps of TOUR_STEPS (constants/onboardingTour.js) via
# "Next"/"Done", checking each step's exact title. Steps 1-3 spotlight the
# Skyline screen, steps 4-5 the Community and Profile tab buttons.
---
- launchApp:
    clearState: true
- tapOn: ".*Create an account.*"
- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn: "At least 6 characters"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Create account"
- runFlow: ../_shared/dismiss_samsung_pass.yaml
- runFlow: ../_shared/choose_username.yaml

# 1. the skyline
- assertVisible: "1 OF 5"
- assertVisible: "This is your skyline"
- tapOn:
    id: "tour-next"
# 2. hold to build
- assertVisible: "Hold to build"
- tapOn:
    id: "tour-next"
# 3. tap a tower
- assertVisible: "Tap a tower for more"
- tapOn:
    id: "tour-next"
# 4. Community tab
- assertVisible: "Build with friends"
- tapOn:
    id: "tour-next"
# 5. Profile tab (last step: no Skip, Next reads Done)
- assertVisible: "Your settings"
- assertNotVisible:
    id: "tour-skip"
- tapOn: "Done"
- assertNotVisible:
    id: "tour-card"
