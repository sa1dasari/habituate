appId: com.habituate.mobile
# Every brand-new account lands on ChooseUsernameScreen right after signup,
# before anything else (the tour, Today, etc.) — missed entirely in the
# first version of these flows, found from a real run's screenshot.
# ${TEST_USERNAME} must be unique across all Habituate accounts (3-20
# chars, letters/numbers/underscores) — pass one via --env.
---
- tapOn: "yourname"
- inputText: ${TEST_USERNAME}
# The soft keyboard covers "Continue" entirely at this screen height —
# confirmed from a real run's screenshot (the button was correctly
# enabled, just off-screen under the keyboard).
- hideKeyboard
- tapOn: "Continue"
