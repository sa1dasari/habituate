spring.application.name=habituate-api
# Railway injects PORT at runtime; SERVER_PORT alone (Spring's usual env-var
# binding for server.port) isn't what Railway sets, so this needs an explicit
# placeholder rather than relying on relaxed binding like everything else here.
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/habituate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Firebase Admin SDK — path to the service account key JSON.
firebase.service-account-path=C:/Users/sawan/Downloads/OneDrive/Documents/Projects/habituate/api/habituate-ae85f-firebase-adminsdk-fbsvc-ef8e4d3163.json

# Feedback notification emails (Account Settings > Report a Bug/Suggestion) —
# SMTP credentials to SEND from, and the address to notify on every submission.
# All blank by default: FeedbackNotificationService checks for blank config and
# quietly skips sending rather than failing the user's submission — a missing
# notification is never worth blocking a bug report over. Gmail SMTP needs an
# App Password (not the account password) at MAIL_SMTP_PASSWORD.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
feedback.notification-email=${FEEDBACK_NOTIFICATION_EMAIL:}

# Ask Habituate (AI habit coach) — Anthropic Claude API key. Kept out of git via
# application-secrets.properties (gitignored, local-only), unlike the Firebase
# path above — a raw API key is a credential, not just a filesystem location.
# AnthropicClient reads anthropic.api-key with its own fallback to the
# ANTHROPIC_API_KEY env var, so production needs neither this file nor this line.
spring.config.import=optional:classpath:application-secrets.properties
