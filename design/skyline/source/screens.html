<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1216;--s1:#161B21;--s2:#1E252D;--text:#F2F4F6;--muted:#A3ADB8;--amber:#F2C14E;}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow:hidden;position:relative}
.tabs{position:absolute;left:0;right:0;bottom:0;height:76px;border-top:1px solid #222a33;background:var(--bg);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.tab.on{color:var(--amber);font-weight:800}
.tab svg{width:22px;height:22px}
h1{font-weight:800}
.btn{background:var(--s2);border-radius:22px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.legend{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.legend b{display:block;font-size:14px;font-weight:700}
.legend span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.sw{flex:0 0 26px;height:26px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="root"></div>
<script>
const C={front:'#F2C14E',side:'#B98E2C',top:'#F8D57E',lit:'#FFE9B0',dark:'#6B4A38',shield:'#5B7083',open:'#5B6472',ledge:'#F2F4F6'};
function shade(h,p){const n=parseInt(h.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+p*2.55)));return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// floors bottom->top: 'lit','dark','shield','open'. Returns svg string.
function tower({x,base,w,fh,dx,dy,floors,windows=2,today=true,ledgeAfter=null,select=null,gap=1}){
  let s='';const n=floors.length;
  floors.forEach((st,i)=>{
    const y=base-(i+1)*fh;
    const front=`M${x},${y}h${w}v${fh}h${-w}Z`;
    const side=`M${x+w},${y}l${dx},${-dy}v${fh}l${-dx},${dy}Z`;
    if(st==='open'){
      s+=`<path d="${front}" fill="#0F1216" stroke="${C.open}" stroke-width="1"/><path d="${side}" fill="#0F1216" stroke="${C.open}" stroke-width="1"/>`;
      return;
    }
    const f= st==='shield'?C.shield:C.front;
    s+=`<path d="${front}" fill="${f}"/><path d="${side}" fill="${shade(f,-22)}"/>`;
    s+=`<line x1="${x}" x2="${x+w}" y1="${y+fh}" y2="${y+fh}" stroke="${shade(f,-30)}" stroke-width="${gap}"/>`;
    if(st!=='shield'){
      const ww=Math.max(3,w*0.13),wh=Math.max(2,fh*0.42);
      for(let k=0;k<windows;k++){const fx=x+w*((k+1)/(windows+1))-ww/2;
        s+=`<rect x="${fx}" y="${y+fh/2-wh/2}" width="${ww}" height="${wh}" fill="${st==='lit'?C.lit:C.dark}"/>`;}
    }
  });
  const topY=base-n*fh;
  const topF=floors[n-1]==='shield'?C.shield:C.front;
  if(floors[n-1]!=='open') s+=`<path d="M${x},${topY}l${dx},${-dy}h${w}l${-dx},${dy}Z" fill="${shade(topF,18)}"/>`;
  if(today){const y=topY-fh;
    s+=`<path d="M${x},${y}h${w}v${fh}h${-w}Z M${x+w},${y}l${dx},${-dy}v${fh} M${x},${y}l${dx},${-dy}h${w}" fill="none" stroke="${C.front}" stroke-width="1.5" stroke-dasharray="4 3"/>`;}
  if(ledgeAfter!=null){const y=base-ledgeAfter*fh;s+=`<line x1="${x-14}" x2="${x+w+dx+2}" y1="${y}" y2="${y}" stroke="${C.ledge}" stroke-width="3"/>`;}
  if(select!=null){const y=base-(select+1)*fh;s+=`<rect x="${x-5}" y="${y-3}" width="${w+10}" height="${fh+6}" fill="none" stroke="#fff" stroke-width="2.5" rx="2"/>`;}
  return s;
}
const ICON={
 sky:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7"/></svg>',
 ins:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M7 16V9M12 16V5M17 16v-4"/></svg>',
 com:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="8" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 14c3 0 6 1.5 6 4.5"/></svg>',
 pro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'};
const tabs=`<div class="tabs"><div class="tab on">${ICON.sky}Skyline</div><div class="tab">${ICON.ins}Insights</div><div class="tab">${ICON.com}Community</div><div class="tab">${ICON.pro}Profile</div></div>`;
const rep=(st,k)=>Array(k).fill(st);
const screen=new URLSearchParams(location.search).get('s');

if(screen==='towersheet'){
  // 4 past, open, 12-day past run (best), open, current run 9 = 4 lit + shield + 4 lit
  const floors=[...rep('dark',4),'open',...rep('dark',12),'open',...rep('lit',4),'shield',...rep('lit',4)];
  let stars='';for(let i=0;i<40;i++){stars+=`<circle cx="${(i*97)%390}" cy="${(i*53)%130+8}" r="${i%3?0.9:1.4}" fill="#c9d3ff" opacity="${0.35+(i%4)*0.15}"/>`}
  document.getElementById('root').innerHTML=`
  <svg width="390" height="150" style="position:absolute;top:0;left:0"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1030"/><stop offset="1" stop-color="#1A2148"/></linearGradient></defs>
  <rect width="390" height="150" fill="url(#g)"/>${stars}<circle cx="322" cy="70" r="20" fill="#F4EFD8"/><circle cx="331" cy="64" r="18" fill="#121836"/></svg>
  <div style="position:absolute;top:136px;left:0;right:0;bottom:76px;background:var(--s1);border-radius:24px 24px 0 0;padding:0 20px">
    <div style="width:40px;height:4px;border-radius:2px;background:#3A4552;margin:10px auto 12px"></div>
    <div style="display:flex;gap:14px;align-items:center">
      <div style="width:14px;height:34px;border-radius:5px;background:${C.front}"></div>
      <div><h1 style="font-size:26px;line-height:1.1">Write</h1>
      <div style="color:var(--muted);font-size:13.5px;margin-top:2px">Daily · Floor 24 · Under construction</div></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:14px">
      <svg width="104" height="290" style="flex:0 0 104px">${tower({x:22,base:286,w:44,fh:9.2,dx:16,dy:9,floors,windows:2,ledgeAfter:17})}</svg>
      <div style="flex:1">
        <div style="font-size:30px;font-weight:800;color:var(--amber);line-height:1.1">9 day run</div>
        <div style="color:var(--muted);font-size:13px;margin-top:4px;line-height:1.35">The lit floors at the top. Today's floor will make it 10.</div>
        <div class="legend"><div class="sw"><div style="width:22px;height:3px;background:#fff"></div></div><div><b>Best run: 12 days</b><span>The white ledge. It stays even if the run restarts.</span></div></div>
        <div class="legend"><div class="sw"><svg width="24" height="16"><rect width="24" height="16" fill="${C.front}"/><rect x="5" y="5" width="4" height="6" fill="${C.dark}"/><rect x="15" y="5" width="4" height="6" fill="${C.dark}"/></svg></div><div><b>Dark windows</b><span>Earlier floors. Past check-ins stay.</span></div></div>
        <div class="legend"><div class="sw"><svg width="24" height="16"><rect width="24" height="16" fill="${C.shield}"/></svg></div><div><b>Solid block: Shield Day</b><span>No windows. The run kept going.</span></div></div>
        <div class="legend"><div class="sw"><svg width="24" height="16"><rect x=".5" y=".5" width="23" height="15" fill="#0F1216" stroke="${C.open}"/></svg></div><div><b>Open floor</b><span>A soft outline. Floors never come down.</span></div></div>
      </div>
    </div>
    <div style="margin-top:10px;border:1.5px solid var(--amber);background:#2B2717;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center">
      <div style="flex:1"><div style="font-weight:800;font-size:16px">Ready to top out?</div>
      <div style="color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px">You've built this tower for over 30 days. Finish it and start a new one whenever you like.</div></div>
      <div style="background:var(--amber);color:#1b1608;font-weight:800;border-radius:22px;height:44px;padding:0 18px;display:flex;align-items:center">Top out</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
      <div class="btn">See inside</div><div class="btn">Ask about this tower</div><div class="btn">Edit</div><div class="btn">Retire</div>
    </div>
  </div>${tabs}`;
}

if(screen==='crosssection'){
  // 45 days, Sep 30 -> Nov 13 (today unbuilt). index 0 = Sep 30.
  const st=[];for(let i=0;i<44;i++)st.push('dark');
  [3,9,14,22,34].forEach(i=>st[i]='open');
  for(let i=35;i<44;i++)st[i]='lit';st[39]='shield';
  st[18]='shield';
  // best run: days 23..32 (10 days) -> ledge after index 32
  const base=716,fh=10.2,x=58,w=128;
  const yOf=i=>base-(i+0.5)*fh;
  const sel=25; // Oct 25
  const months=[{i:1,l:'Oct'},{i:15,l:'Oct 15'},{i:32,l:'Nov'}];
  document.getElementById('root').innerHTML=`
  <div style="padding:26px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:17px;font-weight:700">‹&nbsp; Write</div><div style="color:var(--muted);font-size:14px;font-weight:700">Inside view</div></div>
    <h1 style="font-size:30px;margin-top:16px">Write</h1>
    <div style="color:var(--muted);font-size:14px;margin-top:2px">Each floor is one day. Drag the handle to move through time.</div>
  </div>
  <svg width="390" height="800" style="position:absolute;top:0;left:0">
    ${months.map(m=>`<text x="8" y="${yOf(m.i)+4}" fill="${'#A3ADB8'}" font-size="11" font-weight="700" font-family="Nunito">${m.l}</text>`).join('')}
    ${tower({x,base,w,fh,dx:20,dy:11,floors:st,windows:3,ledgeAfter:34,select:sel})}
    <text x="${x+w+28}" y="${base-45*fh+8}" fill="#A3ADB8" font-size="12" font-weight="700" font-family="Nunito">Today</text>
    <text x="8" y="${base-34*fh-6}" fill="#F2F4F6" font-size="11" font-weight="800" font-family="Nunito">Best run</text>
    <line x1="352" x2="352" y1="${base-45*fh}" y2="${base}" stroke="#3A4552" stroke-width="3" stroke-linecap="round"/>
    <line x1="${x+w+6}" x2="336" y1="${yOf(sel)}" y2="${yOf(sel)}" stroke="#5B6472" stroke-dasharray="3 3"/>
    <circle cx="352" cy="${yOf(sel)}" r="15" fill="#fff"/><circle cx="352" cy="${yOf(sel)}" r="4" fill="#0F1216"/>
  </svg>
  <div style="position:absolute;left:206px;top:${yOf(sel)-96}px;width:128px;background:var(--s2);border-radius:14px;padding:10px 12px">
    <div style="font-weight:800;font-size:15px">Sun, Oct 25</div>
    <div style="color:var(--muted);font-size:12.5px;margin-top:2px">Built · 350 words</div>
    <div style="color:var(--amber);font-size:12.5px;font-weight:800;margin-top:6px">Ask about this day</div>
  </div>
  <div style="position:absolute;left:16px;right:16px;top:${base+12}px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600">
    <span style="display:flex;gap:5px;align-items:center"><svg width="16" height="10"><rect width="16" height="10" fill="${C.front}"/><rect x="3" y="3" width="3" height="4" fill="${C.lit}"/><rect x="10" y="3" width="3" height="4" fill="${C.lit}"/></svg>This run</span>
    <span style="display:flex;gap:5px;align-items:center"><svg width="16" height="10"><rect width="16" height="10" fill="${C.front}"/><rect x="3" y="3" width="3" height="4" fill="${C.dark}"/><rect x="10" y="3" width="3" height="4" fill="${C.dark}"/></svg>Earlier</span>
    <span style="display:flex;gap:5px;align-items:center"><svg width="16" height="10"><rect width="16" height="10" fill="${C.shield}"/></svg>Shield Day</span>
    <span style="display:flex;gap:5px;align-items:center"><svg width="16" height="10"><rect x=".5" y=".5" width="15" height="9" fill="#0F1216" stroke="${C.open}"/></svg>Open</span>
  </div>
  ${tabs}`;
}
</script></body></html>
