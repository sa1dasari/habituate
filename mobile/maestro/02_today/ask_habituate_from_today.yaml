appId: com.habituate.mobile
# Ask Habituate's entry point lives on Today's header (chat icon, top-right)
# now, not Insights — this covers both that icon and the lower teaser banner
# opening the real chat modal directly, no cross-tab navigation involved.
---
- runFlow: ../_shared/login.yaml
- tapOn: "Ask Habituate"
- assertVisible: "Ask Habituate"
- tapOn: "Back"
- assertVisible: "Today"
