appId: com.habituate.mobile
# Taps through all 15 steps of TOUR_STEPS (constants/onboardingTour.js) via
# "Next"/"Let's go", confirming each real screen/modal it's supposed to
# spotlight actually opens and closes in step with the walkthrough —
# not a static slideshow, per its own design.
---
- launchApp:
    clearState: true
- tapOn: ".*Create an account.*"
- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn: "At least 6 characters"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Create account"
- runFlow: ../_shared/dismiss_samsung_pass.yaml
- runFlow: ../_shared/choose_username.yaml

# 1. welcome (Today)
- assertVisible: "Welcome to Habituate"
- tapOn: "Next"
# 2. habits-intro (Today tab, TODAY_ADD_HABIT_BUTTON spotlighted)
- assertVisible: "Habits start right here"
- tapOn: "Next"
# 3. habits-create-form (real TowerForm modal opens, over Today)
- assertVisible: "You're looking at the real form"
- assertVisible: "Lay a foundation"
- tapOn: "Next"
# 4. habits-shield (Today tab's shield icon spotlighted)
- assertVisible: "Shield Days have your back"
- tapOn: "Next"
# 5. shield-days-info (real Shield Days info modal, opened from Today)
- assertVisible: "Here's exactly how it works"
- tapOn: "Next"
# 6. community-intro (Community tab)
- assertVisible: "Community is where it gets social"
- tapOn: "Next"
# 7. community-create-group
- assertVisible: "Shared Habits = one streak, two people"
- tapOn: "Next"
# 8. shared-habit-form (real create-shared-habit screen)
- assertVisible: "The actual create screen"
- tapOn: "Next"
# 9. community-create-challenge
- assertVisible: "Challenges play by different rules"
- tapOn: "Next"
# 10. challenge-form (real create-challenge screen)
- assertVisible: "Build your own Challenge"
- tapOn: "Next"
# 11. streak-freeze-info
- assertVisible: "Streak Freezes protect the group"
- tapOn: "Next"
# 12. insights-consistency (Insights tab)
- assertVisible: "Your consistency, at a glance"
- tapOn: "Next"
# 13. insights-coach (back on Today tab, chat icon spotlighted)
- assertVisible: "Meet Ask Habituate"
- tapOn: "Next"
# 14. ask-habituate-chat (real chat modal)
- assertVisible: "You're in the real coach right now"
- tapOn: "Next"
# 15. finish (Today)
- assertVisible: "You're set. Go build something."
- tapOn: "Let's go"
- assertVisible: "Today"
# Nothing from the tour should be left open behind it.
- assertNotVisible: "Skip tour"
