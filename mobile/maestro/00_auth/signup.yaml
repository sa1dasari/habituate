appId: com.habituate.mobile
# Creates a brand-new account — ${TEST_EMAIL}/${TEST_PASSWORD} must NOT
# already exist. Run once to provision the account the other flows'
# _shared/login.yaml then reuses. ${TEST_USERNAME} must be globally unique.
---
- launchApp:
    clearState: true
- tapOn: ".*Create an account.*"
- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn: "At least 6 characters"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Create account"
- runFlow: ../_shared/dismiss_samsung_pass.yaml
# Every brand-new account must choose a username before anything else.
- runFlow: ../_shared/choose_username.yaml
# First-ever login — the onboarding tour auto-starts (useAutoStartTour).
- assertVisible: "Welcome to Habituate"
- tapOn: "Just add my first habit"
- assertVisible: "Today"
