appId: com.habituate.mobile
# STILL BROKEN, NOT FIXED 2026-11-20 — unlike the other three flows in this
# folder, this one genuinely cannot be rewritten yet: Retire (archive) and
# Restore have no entry point anywhere in the live "Today" tab at all right
# now (SKYLINE.md section 14 #20 — TowerSheet.js/ArchivedTowersSheet.js,
# which carry Retire/Restore, are only reachable via the dev-only
# SkylineReal tab, not what actually ships). create_habit_full_form.yaml,
# edit_habit.yaml and delete_habit.yaml were rewritten this session against
# the new Skyline-tab entry points; this one is left stale on purpose
# rather than faked against a flow that doesn't exist in production.
# Revisit once the SkylineScreen swap lands and Retire/Restore are reachable
# from whatever screen ends up live.
#
# Below is the ORIGINAL (also stale, pre-rebuild) flow, kept for reference
# only — do not run as-is, "Habits" tab and "+ New"/"Add habit" no longer
# exist regardless of the Retire/Restore gap above.
---
- runFlow: ../_shared/login.yaml
- tapOn: "Habits"
- tapOn: "+ New"
- tapOn: "e.g. Morning walk"
- inputText: "Stretch"
- hideKeyboard
- tapOn: "e.g. 3"
- inputText: "4"
- hideKeyboard
- tapOn: "Why does this matter to you? (optional)"
- inputText: "Fewer aches at my desk"
- hideKeyboard
- tapOn: "Add habit"
- assertVisible: "Stretch"

- tapOn:
    text: "Edit Stretch"
- scrollUntilVisible:
    element: "Archive"
    direction: DOWN
- tapOn: "Archive"
- assertVisible: "Archive this habit?"
- tapOn: "Archive"
- assertNotVisible: "Stretch"

# Section header reads "Archived (N)" — regex match, not exact text.
- tapOn: "Archived.*"
- assertVisible: "Stretch"
- tapOn: "Restore"
- tapOn: "Habits"
- assertVisible: "Stretch"
- tapOn:
    text: "Edit Stretch"
- assertVisible: "4"
- assertVisible: "Fewer aches at my desk"
