appId: com.habituate.mobile
# Covers the fast-path fix from this session: the welcome step's explicit
# "Skip — just add my first habit" action should leave the user on Today
# with the one-tap template picker immediately usable, not a blank screen.
---
- launchApp:
    clearState: true
- tapOn: ".*Create an account.*"
- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn: "At least 6 characters"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Create account"
- runFlow: ../_shared/dismiss_samsung_pass.yaml
- runFlow: ../_shared/choose_username.yaml
- assertVisible: "Welcome to Habituate"
- tapOn: "Skip — just add my first habit"
- assertVisible: "Today"
- assertVisible: "Add your first habit"
# One-tap template picker should be immediately usable, not another tap away.
- assertVisible: "Drink water"
- tapOn:
    text: "Add \"Drink water\" as a habit"
- assertNotVisible: "Add your first habit"
