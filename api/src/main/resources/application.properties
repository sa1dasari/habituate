spring.application.name=habituate-api
# Railway injects PORT at runtime; SERVER_PORT alone (Spring's usual env-var
# binding for server.port) isn't what Railway sets, so this needs an explicit
# placeholder rather than relying on relaxed binding like everything else here.
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/habituate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Firebase Admin SDK — path to the service account key JSON.
firebase.service-account-path=C:/Users/sawan/Downloads/OneDrive/Documents/Projects/habituate/api/habituate-ae85f-firebase-adminsdk-fbsvc-ef8e4d3163.json

# Outbound transactional email — shared SMTP config for everything that sends
# mail: FeedbackNotificationService (Account Settings > Report a Bug/Suggestion)
# and InviteEmailService (friend requests, group invites). All blank by
# default: both services check for blank config and quietly skip sending
# rather than failing the real operation — a missing email is never worth
# blocking a friend request or bug report over.
#
# Local dev defaults to Gmail SMTP (needs an App Password, not the account
# password, at MAIL_SMTP_PASSWORD). Production is intended to point at AWS
# SES's SMTP interface instead — set MAIL_SMTP_HOST to
# email-smtp.<region>.amazonaws.com, MAIL_SMTP_PORT=587, and
# MAIL_SMTP_USERNAME/PASSWORD to SES's own SMTP credentials (not your AWS
# access key — SES issues separate SMTP-specific credentials). Before that
# works for real: verify a sending domain/address in the SES console, and
# request production access (SES starts every account in a sandbox that can
# only send to pre-verified recipient addresses) — both are manual AWS
# console steps, not something this codebase can do for you.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
feedback.notification-email=${FEEDBACK_NOTIFICATION_EMAIL:}

# Ask Habituate (AI habit coach) — Anthropic Claude API key. Kept out of git via
# application-secrets.properties (gitignored, local-only), unlike the Firebase
# path above — a raw API key is a credential, not just a filesystem location.
# AnthropicClient reads anthropic.api-key with its own fallback to the
# ANTHROPIC_API_KEY env var, so production needs neither this file nor this line.
spring.config.import=optional:classpath:application-secrets.properties
